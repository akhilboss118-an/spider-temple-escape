<style>
    /* Custom game atmospheric keyframes & textures */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); filter: drop-shadow(0 0 12px rgba(242, 202, 80, 0.45)); }
      50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 24px rgba(242, 202, 80, 0.8)); }
    }
    @keyframes runicBreathe {
      0%, 100% { opacity: 0.6; text-shadow: 0 0 8px rgba(0, 228, 120, 0.5); }
      50% { opacity: 1; text-shadow: 0 0 18px rgba(0, 228, 120, 0.95); }
    }
    @keyframes particleDrift {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-70px) translateX(25px); opacity: 0; }
    }
    .animate-pulse-glow {
      animation: pulseGlow 3.5s ease-in-out infinite;
    }
    .animate-runic {
      animation: runicBreathe 2.8s ease-in-out infinite;
    }
    .mote-1 { animation: particleDrift 5s ease-in-out infinite; }
    .mote-2 { animation: particleDrift 7s ease-in-out infinite 1.5s; }
    .mote-3 { animation: particleDrift 6s ease-in-out infinite 3s; }

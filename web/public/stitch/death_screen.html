<!-- Core Layout Styles -->
<style data-purpose="layout">
    body {
      background-color: #050608;
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    /* Device Frame Simulation for iOS Portrait */
    .mobile-screen {
      width: 100%;
      max-width: 430px;
      min-height: 844px;
      height: 100dvh;
      overflow-y: auto;
      position: relative;
    }

    /* Hide scrollbars for clean HUD appearance */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- Game UI Visual Effects Styles -->
<style data-purpose="game-visuals">
    /* Chiseled Metallic Text Glow */
    .title-metallic-death {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFB677 30%, #D83324 75%, #6B0808 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 16px rgba(214, 34, 34, 0.65));
      letter-spacing: 0.04em;
    }

    .gold-emboss {
      background: linear-gradient(180deg, #FFF1B8 0%, #F5C242 45%, #C28B12 85%, #694403 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* Ancient stone texture gradient */
    .obsidian-tablet {
      background: radial-gradient(120% 100% at 50% 0%, #1a222c 0%, #0d1217 60%, #080a0d 100%);
    }

    /* Golden primary CTA metallic surface */
    .gold-btn-gradient {
      background: linear-gradient(180deg, #FFE896 0%, #F2B82C 24%, #D48C07 68%, #7C4F02 100%);
      box-shadow: 0 4px 0 #543400, 0 8px 25px rgba(242, 184, 44, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .gold-btn-gradient:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #543400, 0 4px 15px rgba(242, 184, 44, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* Aztec runic corner embellishment */
    .corner-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: #F5C242;
      pointer-events: none;
    }
    .corner-tl { top: 6px; left: 6px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 6px; right: 6px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 6px; left: 6px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 6px; right: 6px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Pulsing crimson danger animation */
    @keyframes pulse-crimson {
      0%, 100% {
        box-shadow: 0 0 12px rgba(214, 34, 34, 0.4), inset 0 0 8px rgba(214, 34, 34, 0.25);
        border-color: rgba(214, 34, 34, 0.8);
      }
      50% {
        box-shadow: 0 0 24px rgba(214, 34, 34, 0.85), inset 0 0 14px rgba(214, 34, 34, 0.5);
        border-color: rgba(255, 87, 87, 1);
      }
    }
    .pulse-danger {
      animation: pulse-crimson 2.4s infinite ease-in-out;
    }

    /* Ambient floating ember particles */
    @keyframes float-ember {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-70px) translateX(12px); opacity: 0; }
    }
    .ember-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #FFA43B;
      border-radius: 9999px;
      box-shadow: 0 0 6px #FF4500, 0 0 10px #FF0000;
      animation: float-ember 4s infinite linear;
      pointer-events: none;
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spider Temple Escape - Web Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080c0a;
        color: #e2f0e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        max-width: 480px;
        aspect-ratio: 9/16;
        background: #0b1410;
        box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 190, 40, 0.15);
        border: 2px solid rgba(255, 200, 50, 0.3);
        border-radius: 12px;
      }
      #status-card {
        position: absolute;
        z-index: 10;
        text-align: center;
        padding: 24px;
        background: rgba(10, 18, 14, 0.94);
        border: 1px solid rgba(255, 200, 50, 0.3);
        border-radius: 16px;
        max-width: 380px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }
      h2 { color: #f5bc32; font-size: 20px; margin-bottom: 8px; }
      p { font-size: 13px; color: #a4b8ad; line-height: 1.5; margin-bottom: 16px; }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 12px auto;
        border: 3px solid rgba(245, 188, 50, 0.2);
        border-top-color: #f5bc32;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tip { font-size: 11px; color: #628270; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="status-card">
        <div class="spinner" id="spinner"></div>
        <h2 id="status-title">🕷️ Spider Temple Escape</h2>
        <p id="status-desc">Loading WebGL Expedition Engine...</p>
        <div class="tip">Controls: W/Up = Jump • S/Down = Slide • A/D = Turn/Lane</div>
      </div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const statusCard = document.querySelector("#status-card");
      const statusDesc = document.querySelector("#status-desc");
      const spinner = document.querySelector("#spinner");

      // Check if compiled Unity WebGL build files are available
      const loaderUrl = "Build/game.loader.js";
      const config = {
        dataUrl: "Build/game.data",
        frameworkUrl: "Build/game.framework.js",
        codeUrl: "Build/game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SpiderHero",
        productName: "Spider Temple Escape",
        productVersion: "1.0.0",
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          statusDesc.innerText = `Preparing Jungle Assets: ${Math.round(progress * 100)}%`;
        }).then((unityInstance) => {
          statusCard.style.display = "none";
        }).catch((message) => {
          statusDesc.innerText = "Error loading WebGL instance: " + message;
        });
      };
      script.onerror = () => {
        spinner.style.display = "none";
        statusDesc.innerHTML = "Unity WebGL Build is ready for compilation.<br>Run <code>.\\build_webgl.ps1</code> or use <b>Runner &gt; WebGL &gt; Build WebGL Playable Demo</b> in Unity to generate live WASM assets!";
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
